  <style>
    :root {
      --bg: #f5f7f4;
      --surface: #ffffff;
      --surface-alt: #eef2ec;
      --text: #161b15;
      --muted: #4b5649;
      --border: #c5d0c1;
      --accent: #3a7233;
      --accent-soft: #e7f1e3;
      --grape-tint: #94b374;
      --warn-bg: #fff8e7;
      --warn-border: #d49b2a;
      --err-bg: #fdf0ef;
      --err-border: #c94a4a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 48px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.4;
    }

    header {
      background: #1f291e;
      color: #ffffff;
      padding: 14px 16px;
      border-bottom: 4px solid var(--accent);
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.2px;
      text-align: center;
    }

    header p {
      margin: 3px 0 0 0;
      font-size: 13px;
      color: #d4dfd1;
      text-align: center;
    }

    .tabs-wrap {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .tabs {
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 12px;
    }

    .tab-btn {
      min-height: 48px;
      padding: 8px 10px;
      font-size: 15px;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px;
    }

    .control-box {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      margin-bottom: 6px;
      text-align: center;
    }

    select, input[type="text"] {
      width: 100%;
      min-height: 52px;
      padding: 10px 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      background: #ffffff;
      border: 2px solid var(--text);
      border-radius: 6px;
    }

    .summary-banner {
      background: var(--surface);
      border: 2px solid var(--text);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      text-align: center;
    }

    .summary-title {
      font-size: 20px;
      font-weight: 900;
      margin: 0 0 4px 0;
    }

    .summary-sub {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      margin: 0;
    }

    .group-heading {
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--accent);
      background: var(--accent-soft);
      border-left: 5px solid var(--accent);
      padding: 8px 12px;
      margin: 14px 0 8px 0;
      border-radius: 0 6px 6px 0;
    }

    .valve-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .valve-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .valve-badge {
      background: var(--text);
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      padding: 5px 11px;
      border-radius: 5px;
    }

    .block-name {
      font-size: 19px;
      font-weight: 800;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }

    .metric-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .metric-val {
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
      margin-top: 2px;
    }

    .sub-detail {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 6px;
    }

    .note-box {
      background: var(--warn-bg);
      border: 1.5px solid var(--warn-border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      text-align: left;
    }

    .err-box {
      background: var(--err-bg);
      border: 1.5px solid var(--err-border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 700;
      color: #7d2222;
      margin-top: 10px;
      text-align: left;
    }

    .translator-box {
      margin-top: 22px;
      background: var(--surface);
      border: 2px solid var(--grape-tint);
      border-radius: 8px;
      padding: 12px;
    }

    .translator-sub {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      margin: -2px 0 8px 0;
    }

    .shorthand-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .go-btn {
      min-height: 52px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: 800;
      background: var(--accent);
      color: #ffffff;
      border: 2px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .shorthand-result-header {
      background: var(--surface-alt);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .shorthand-token {
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
    }

    .shorthand-interp {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Raupo Irrigation Lookup</h1>
    <p>Hunter Blocks • Valves &amp; Outer Rows</p>
  </header>

  <div class="tabs-wrap">
    <nav class="tabs" aria-label="Lookup mode">
      <button id="tab-hunter" class="tab-btn active" onclick="setMode('hunter')">Hunter Block</button>
      <button id="tab-valve" class="tab-btn" onclick="setMode('valve')">Valve / Station</button>
    </nav>
  </div>

  <main class="container">
    <section id="controls-hunter" class="control-box">
      <label for="select-hunter">Select Hunter Block (1–23)</label>
      <select id="select-hunter" onchange="renderHunter(Number(this.value))"></select>
    </section>

    <section id="controls-valve" class="control-box" style="display:none;">
      <label for="select-valve">Select Valve / Station (1–36, no V34)</label>
      <select id="select-valve" onchange="renderValve(Number(this.value))"></select>
    </section>

    <section id="output"></section>

    <section class="translator-box" aria-label="Vineyard block translator">
      <label for="shorthand-input">Vineyard Block Translator</label>
      <div class="translator-sub">Translate above-ground vineyard blocks, clone map codes &amp; shorthand to valves</div>
      <div class="shorthand-row">
        <input
          id="shorthand-input"
          type="text"
          placeholder="e.g. LOU1, OSI7, WIL4, WILVI, FIN YV, OSIPN3"
          onkeydown="if (event.key === 'Enter') runShorthand();"
        />
        <button type="button" class="go-btn" onclick="runShorthand()">Translate</button>
      </div>
      <div id="shorthand-output"></div>
    </section>
  </main>

      { keys: ["LOU3", "LOUIS3", "LOUSB3"], label: "Louis 3 — LOUSB3 (Sauv Blanc MS • Clone Map R:75–105)", valves: [18], note: "Valve 18 (Row 91, Rows 75–105), also paired in Hunter Block 19 (YV1)." },
      { keys: ["LOU4", "LOUIS4", "LOUPN4"], label: "Louis 4 — LOUPN4 (Pinot Noir AM 10/5 • Clone Map R:106–128)", valves: [13], note: "Valve 13 (Row 106, Rows 105–128)." },
      { keys: ["LOUSB"], label: "Louis Sauvignon Blanc (LOUSB1 & LOUSB3 • Hunter Block 14)", valves: [17, 18], note: "Covers LOUSB1 (Valve 17, R:1–38) and LOUSB3 (Valve 18, R:75–105)." },
      { keys: ["LOUPN"], label: "Louis Pinot Noir (LOUPN2 & LOUPN4 • Hunter Block 15)", valves: [12, 13], note: "Covers LOUPN2 (Valve 12, R:39–74) and LOUPN4 (Valve 13, R:106–128)." },
      { keys: ["LOU", "LOUIS"], label: "Louis (All Louis Blocks 1–4)", valves: [17, 12, 18, 13], note: "Louis alternates SB and PN: LOU1/LOUSB1 (V17), LOU2/LOUPN2 (V12), LOU3/LOUSB3 (V18), LOU4/LOUPN4 (V13)." },

      { keys: ["SAC1", "SACHA1", "SACPN1"], label: "Sacha 1 — SACPN1 (PN 777 • Clone Map R:1–44)", valves: [8], note: "Valve 8 (Row 23, Rows 1–44)." },
      { keys: ["SAC2", "SACHA2", "SACPN2"], label: "Sacha 2 — SACPN2 (PN BDX 115 • Clone Map R:45–72)", valves: [9], note: "Valve 9 (Row 58, Rows 45–72)." },
      { keys: ["SAC3", "SACHA3", "SACPN3"], label: "Sacha 3 — SACPN3 (PN AM 10/5 • Clone Map R:73–100)", valves: [10], note: "Valve 10 (Row 86, Rows 73–100)." },
      { keys: ["SAC4", "SACHA4", "SACPN4"], label: "Sacha 4 — SACPN4 (PN 777 • Clone Map R:101–128)", valves: [11], note: "Valve 11 (Row 114, Rows 101–128)." },
      { keys: ["SAC", "SACHA", "SACPN"], label: "Sacha (All Sacha Pinot Noir Blocks 1–4)", valves: [8, 9, 10, 11], note: "Sacha covers V8 (SACPN1), V9 (SACPN2), V10 (SACPN3), and V11 (SACPN4)." },

      { keys: ["LAN1", "LANA1", "LANSB1", "LAN36"], label: "Lana 1 — LANSB1 (Sauv Blanc MS • Clone Map R:1–18)", valves: [36], note: "Valve 36 (Row 1, Rows 1–16), referenced on Hunter Blocks 12, 21 & 23." },
      { keys: ["LAN2", "LANA2", "LANSB2"], label: "Lana 2 — LANSB2 (Sauv Blanc 316)", valves: [19], note: "Valve 19 (Row 34, Rows 17–51)." },
      { keys: ["LAN3", "LANA3", "LANSB3"], label: "Lana 3 — LANSB3 (Sauv Blanc 317)", valves: [20], note: "Valve 20 (Row 69, Rows 52–85)." },
      { keys: ["LAN", "LANA", "LANSB", "LANA123", "LAN123"], label: "Lana (All Lana Sauv Blanc Blocks 1–3)", valves: [36, 19, 20], note: "Lana spans Valve 36 (LANSB1, R:1–16), Valve 19 (LANSB2, R:17–51), and Valve 20 (LANSB3, R:52–85)." },

      { keys: ["HEL1", "HELEN1", "HELSE1"], label: "Helen 1 — HELSE1 (Semillon BVRC14 • Clone Map R:1–24)", valves: [33], note: "Valve 33 (Row 25, Rows 1–41) irrigates both HELSE1 and HELSE2." },
      { keys: ["HEL2", "HELEN2", "HELSE2"], label: "Helen 2 — HELSE2 (Semillon BVRC14 • Clone Map R:25–40)", valves: [33], note: "Valve 33 (Row 25, Rows 1–41) irrigates both HELSE1 and HELSE2." },
      { keys: ["HELSEM", "HELSE", "HELENSEM"], label: "Helen Semillon (HELSE1 & HELSE2 • Clone Map R:1–40)", valves: [33], note: "Valve 33 (Row 25, Rows 1–41), used in Hunter Blocks 9, 20 & 23." },
      { keys: ["HEL3", "HELEN3", "HELSB3", "HELSB"], label: "Helen 3 — HELSB3 (Sauv Blanc MS • Clone Map R:41–92)", valves: [24, 23], note: "Split across Valve 24 (Row 54, Rows 42–66) and Valve 23 (Row 80, Rows 67–90)." },
      { keys: ["HEL", "HELEN"], label: "Helen (Semillon 1–2 & Sauv Blanc 3)", valves: [33, 24, 23], note: "Helen includes Semillon (Valve 33, R:1–41) and Sauv Blanc 3 (Valves 24 & 23, R:42–90)." },

      { keys: ["LIL", "LILLY", "LILSB", "LIL1"], label: "Lilly — LILSB (Sauv Blanc MS • Clone Map R:1–56)", valves: [21, 22], note: "Crossover alert: Valve 21 (Row 21, South R:1–42S) sits on the William/Lilly boundary track; Valve 22 (Paddock, North R:1–42N) covers North." },

      { keys: ["FIN1", "FINBAR1", "FINSB1", "FINSB"], label: "Finbar 1 — FINSB1 (Sauv Blanc MS • Clone Map R:1–13)", valves: [29], note: "Valve 29 (Row 21, Rows 1–21) covers FINSB1 and FINRI2." },
      { keys: ["FIN2", "FINBAR2", "FINRI2"], label: "Finbar 2 — FINRI2 (Riesling GM 239 • Clone Map R:14–21)", valves: [29], note: "Valve 29 (Row 21, Rows 1–21) covers FINSB1 and FINRI2." },
      { keys: ["FIN3", "FINBAR3", "FINRI3", "FINRI"], label: "Finbar 3 — FINRI3 (Riesling GM 110 • Clone Map R:22–44)", valves: [30], note: "Valve 30 (Row 22, Rows 22–44)." },
      { keys: ["FINYV", "FINBARYV", "FINBAR2YV", "FIN2YV"], label: "Finbar Young Vine (Extrapolated from Hunter Block 20)", valves: [29], note: "Extrapolated from Hunter Block 20 (YV2 HEL, LEOCHN, FIN), which assigns Finbar to Valve 29 (Row 21, Rows 1–21)." },
      { keys: ["FIN", "FINBAR"], label: "Finbar (FINSB1 & FINRI2–3 • Hunter Block 3)", valves: [29, 30], note: "Finbar spans Valve 29 (FINSB1/FINRI2, R:1–21) and Valve 30 (FINRI3, R:22–44)." },

      { keys: ["LEO1", "LEOPOLD1", "LEOPN1", "LEOPN"], label: "Leopold 1 — LEOPN1 (Pinot Noir UCD5 • Clone Map R:1–89)", valves: [14, 15, 27], note: "Split between Leopold PN North (Valve 14 R:1–42, Valve 15 R:43–82) and Leopold PN South (Valve 27 R:11–82)." },
      { keys: ["LEO2", "LEOPOLD2", "LEOCH2"], label: "Leopold 2 — LEOCH2 (Chardonnay Mendoza • Clone Map R:90–114)", valves: [28, 16], note: "Leopold Chardonnay is split North (Valve 28, Paddock, N. Rows 83–132) and South (Valve 16, Row 168, S. Rows 83–171)." },
      { keys: ["LEO3", "LEOPOLD3", "LEOCH3"], label: "Leopold 3 — LEOCH3 (Chardonnay UCD15 • Clone Map R:115–131)", valves: [28, 16], note: "Leopold Chardonnay is split North (Valve 28, N. Rows 83–132) and South (Valve 16, S. Rows 83–171)." },
      { keys: ["LEO4", "LEOPOLD4", "LEOCH4"], label: "Leopold 4 — LEOCH4 (Chardonnay B 95 • Clone Map R:132–171)", valves: [16], note: "Valve 16 (Row 168, S. Rows 83–171) covers Leopold Chardonnay South." },
      { keys: ["LEOCH", "LEOPOLDCH", "LEOCHN", "LEOCHS"], label: "Leopold Chardonnay (LEOCH2–4 • Hunter Block 10)", valves: [28, 16], note: "North = Valve 28 (Paddock, N. Rows 83–132); South = Valve 16 (Row 168, S. Rows 83–171)." },
      { keys: ["LEO", "LEOPOLD"], label: "Leopold (Pinot Noir 1 & Chardonnay 2–4)", valves: [14, 15, 27, 28, 16], note: "Leopold includes PN North (V14, V15), PN South (V27), CH North (V28), and CH South (V16)." },

      { keys: ["SYL1", "SYLVAIN1", "SYLCH1"], label: "Sylvain 1 — SYLCH1 (Chardonnay B 95 • Clone Map R:16–31)", valves: [25], note: "Valve 25 (Row 46, Rows 17–46) covers SYLCH1 and upper SYLCH2." },
      { keys: ["SYL2", "SYLVAIN2", "SYLCH2"], label: "Sylvain 2 — SYLCH2 (Chardonnay UCD15 • Clone Map R:32–53)", valves: [25, 26], note: "Split across Valve 25 (Row 46, Rows 17–46) and Valve 26 (Row 47, Rows 47–90)." },
      { keys: ["SYL3", "SYLVAIN3", "SYLCH3"], label: "Sylvain 3 — SYLCH3 (Chardonnay)", valves: [26], note: "Valve 26 (Row 47, Rows 47–90) covers lower SYLCH2 and SYLCH3." },
      { keys: ["SYL", "SYLVAIN", "SYLCH"], label: "Sylvain (Chardonnay SYLCH1–3 • Hunter Block 2)", valves: [25, 26], note: "Covers Sylvain via Valve 25 (Row 46, Rows 17–46) and Valve 26 (Row 47, Rows 47–90)." }
    ];

    const BLOCK_CATALOG = {
      OSI: { name: "Osip", valid: "OSIP1–8 / OSIPN1–8 (Pinot Noir)" },
      OSIP: { name: "Osip", valid: "OSIP1–8 / OSIPN1–8 (Pinot Noir)" },
      WIL: { name: "William", valid: "WIL1 / WILSY1 (Syrah), WIL2–4 / WILPG2–4 (Pinot Gris), WIL5 / WILVI5 (Viognier)" },
      WILLIAM: { name: "William", valid: "WIL1 / WILSY1 (Syrah), WIL2–4 / WILPG2–4 (Pinot Gris), WIL5 / WILVI5 (Viognier)" },
      LOU: { name: "Louis", valid: "LOU1 / LOUSB1 (SB), LOU2 / LOUPN2 (PN), LOU3 / LOUSB3 (SB), LOU4 / LOUPN4 (PN)" },
      LOUIS: { name: "Louis", valid: "LOU1 / LOUSB1 (SB), LOU2 / LOUPN2 (PN), LOU3 / LOUSB3 (SB), LOU4 / LOUPN4 (PN)" },
      SAC: { name: "Sacha", valid: "SAC1–4 / SACPN1–4 (Pinot Noir)" },
      SACHA: { name: "Sacha", valid: "SAC1–4 / SACPN1–4 (Pinot Noir)" },
      LAN: { name: "Lana", valid: "LAN1–3 / LANSB1–3 (Sauvignon Blanc)" },
      LANA: { name: "Lana", valid: "LAN1–3 / LANSB1–3 (Sauvignon Blanc)" },
      HEL: { name: "Helen", valid: "HEL1–2 / HELSE1–2 (Semillon), HEL3 / HELSB3 (Sauvignon Blanc)" },
      HELEN: { name: "Helen", valid: "HEL1–2 / HELSE1–2 (Semillon), HEL3 / HELSB3 (Sauvignon Blanc)" },
      LIL: { name: "Lilly", valid: "LIL / LILSB (Sauvignon Blanc)" },
      LILLY: { name: "Lilly", valid: "LIL / LILSB (Sauvignon Blanc)" },
      FIN: { name: "Finbar", valid: "FIN1 / FINSB1 (SB), FIN2–3 / FINRI2–3 (Riesling), FIN YV" },
      FINBAR: { name: "Finbar", valid: "FIN1 / FINSB1 (SB), FIN2–3 / FINRI2–3 (Riesling), FIN YV" },
      LEO: { name: "Leopold", valid: "LEO1 / LEOPN1 (Pinot Noir), LEO2–4 / LEOCH2–4 (Chardonnay)" },
      LEOPOLD: { name: "Leopold", valid: "LEO1 / LEOPN1 (Pinot Noir), LEO2–4 / LEOCH2–4 (Chardonnay)" },
      SYL: { name: "Sylvain", valid: "SYL1–3 / SYLCH1–3 (Chardonnay)" },
      SYLVAIN: { name: "Sylvain", valid: "SYL1–3 / SYLCH1–3 (Chardonnay)" }
    };

    const valveMap = Object.fromEntries(DATA.valves.map(v => [v.valve, v]));
    const hunterMap = Object.fromEntries(DATA.hunterBlocks.map(h => [h.id, h]));

    let currentMode = "hunter";
    let currentHunterId = 1;
    let currentValveNum = 1;

    function initControls() {
      const selHunter = document.getElementById("select-hunter");
      DATA.hunterBlocks.forEach(hb => {
        const opt = document.createElement("option");
        opt.value = hb.id;
        opt.textContent = `Block ${hb.id} — ${hb.raw}`;
        selHunter.appendChild(opt);
      });

      const selValve = document.getElementById("select-valve");
      DATA.valves.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.valve;
        opt.textContent = `Valve ${v.valve} — ${v.block} (${v.loc})`;
        selValve.appendChild(opt);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      ["hunter", "valve"].forEach(m => {
        document.getElementById(`tab-${m}`).classList.toggle("active", m === mode);
        document.getElementById(`controls-${m}`).style.display = m === mode ? "block" : "none";
      });

      if (mode === "hunter") renderHunter(currentHunterId);
      if (mode === "valve") renderValve(currentValveNum);
    }

    function valveCardHTML(v, showBlockTitle = true) {
      return `
        <div class="valve-card">
          <div class="valve-top">
            <span class="valve-badge">VALVE ${v.valve}</span>
            ${showBlockTitle ? `<span class="block-name">${v.block.toUpperCase()}</span>` : ""}
          </div>
          <div class="metrics">
            <div class="metric-box">
              <div class="metric-label">Valve Location</div>
              <div class="metric-val">${v.loc}</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">Outer Rows</div>
              <div class="metric-val">${v.rows}</div>
            </div>
          </div>
          <div class="sub-detail">Section / Clone: ${v.sub}</div>
        </div>
      `;
    }

    function renderHunter(id) {
      currentHunterId = id;
      document.getElementById("select-hunter").value = id;

      const hb = hunterMap[id];
      const valves = hb.valves.map(num => valveMap[num]).filter(Boolean);

      const grouped = [];
      const seenBlocks = new Map();
      valves.forEach(v => {
        if (!seenBlocks.has(v.block)) {
          const groupObj = { block: v.block, items: [] };
          seenBlocks.set(v.block, groupObj);
          grouped.push(groupObj);
        }
        seenBlocks.get(v.block).items.push(v);
      });

      let cardsHTML = "";
      grouped.forEach(g => {
        cardsHTML += `<div class="group-heading">${g.block}</div>`;
        cardsHTML += g.items.map(v => valveCardHTML(v, false)).join("");
      });

      document.getElementById("output").innerHTML = `
        <div class="summary-banner">
          <h2 class="summary-title">Hunter Block ${hb.id}: ${hb.clean}</h2>
          <p class="summary-sub">Sheet label: "${hb.raw}" • Valves: ${hb.valves.join(", ")}</p>
          ${hb.note ? `<div class="note-box">Note: ${hb.note}</div>` : ""}
        </div>
        ${cardsHTML}
      `;
    }

    function renderValve(num) {
      currentValveNum = num;
      document.getElementById("select-valve").value = num;
      const v = valveMap[num];
      document.getElementById("output").innerHTML = valveCardHTML(v, true);
    }

    function normalizeCode(raw) {
      return raw
        .toUpperCase()
        .replace(/[-–—/(),.]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function decodeToken(rawToken) {
      const clean = normalizeCode(rawToken);
      const compact = clean.replace(/\s+/g, "");

      const valveMatch = clean.match(/^(?:V|VALVE|STATION|STN)\s*(\d{1,2})$/);
      if (valveMatch) {
        const vNum = Number(valveMatch[1]);
        if (valveMap[vNum]) {
          return {
            raw: rawToken,
            title: `Direct Valve ${vNum}`,
            valves: [vNum],
            note: `Direct match to Valve ${vNum} (${valveMap[vNum].block}).`,
            isError: false
          };
        }
      }

      const exactRule = BLOCK_TRANSLATIONS.find(r =>
        r.keys.includes(compact) || r.keys.includes(clean)
      );
      if (exactRule) {
        return {
          raw: rawToken,
          title: exactRule.label,
          valves: exactRule.valves,
          note: exactRule.note,
          isError: false
        };
      }

      const blockPrefixMatch = compact.match(/^(OSIP|OSI|WILLIAM|WIL|LOUIS|LOU|SACHA|SAC|LANA|LAN|HELEN|HEL|LILLY|LIL|FINBAR|FIN|LEOPOLD|LEO|SYLVAIN|SYL)([A-Z0-9]+)$/);
      if (blockPrefixMatch) {
        const prefix = blockPrefixMatch[1];
        const info = BLOCK_CATALOG[prefix];
        return {
          raw: rawToken,
          title: `No "${rawToken}" block in ${info.name}`,
          valves: [],
          note: `Valid ${info.name} blocks on the Clone Map: ${info.valid}.`,
          isError: true
        };
      }

      return {
        raw: rawToken,
        title: `Unrecognized block code "${rawToken}"`,
        valves: [],
        note: "Try vineyard blocks like LOU1, LOUSB1, OSI7, OSIPN3, WIL4, WILVI, FIN YV, LAN2, or V29.",
        isError: true
      };
    }

    function runShorthand() {
      const inputEl = document.getElementById("shorthand-input");
      const outEl = document.getElementById("shorthand-output");
      const text = inputEl.value.trim();
      if (!text) {
        outEl.innerHTML = "";
        return;
      }

      const tokens = text
        .split(/[\n,;]+/)
        .map(s => s.trim())
        .filter(Boolean);

      outEl.innerHTML = tokens.map(tok => {
        const res = decodeToken(tok);
        const cards = res.valves
          .map(vn => valveMap[vn])
          .filter(Boolean)
          .map(v => valveCardHTML(v, true))
          .join("");

        return `
          <div class="shorthand-result-header">
            <div class="shorthand-token">"${res.raw}" → Valves: ${res.valves.length ? res.valves.join(", ") : "None"}</div>
            <div class="shorthand-interp">${res.title}</div>
            ${res.note ? `<div class="${res.isError ? "err-box" : "note-box"}">${res.note}</div>` : ""}
          </div>
          ${cards}
        `;
      }).join("");
    }

    initControls();
    renderHunter(1);
  </script>
</body>
</html>
