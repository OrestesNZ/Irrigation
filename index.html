    :root {
      --bg: #f4f5f6;
      --surface: #ffffff;
      --surface-alt: #eef0f2;
      --text: #111315;
      --muted: #4b525a;
      --border: #c8cfd6;
      --accent: #134e2a;
      --accent-soft: #e4f1e8;
      --warn-bg: #fff6e5;
      --warn-border: #d99b26;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0 0 48px 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.4;
    }

    header {
      background: var(--text);
      color: #ffffff;
      padding: 14px 16px;
      border-bottom: 4px solid var(--accent);
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.2px;
      text-align: center;
    }

    header p {
      margin: 3px 0 0 0;
      font-size: 13px;
      color: #d0d6dc;
      text-align: center;
    }

    .tabs-wrap {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .tabs {
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px 12px;
    }

    .tab-btn {
      min-height: 48px;
      padding: 8px 10px;
      font-size: 15px;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 12px;
    }

    .control-box {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--muted);
      margin-bottom: 6px;
      text-align: center;
    }

    select, input[type="text"] {
      width: 100%;
      min-height: 52px;
      padding: 10px 12px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      background: #ffffff;
      border: 2px solid var(--text);
      border-radius: 6px;
    }

    .summary-banner {
      background: var(--surface);
      border: 2px solid var(--text);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 14px;
      text-align: center;
    }

    .summary-title {
      font-size: 20px;
      font-weight: 900;
      margin: 0 0 4px 0;
    }

    .summary-sub {
      font-size: 14px;
      color: var(--muted);
      font-weight: 600;
      margin: 0;
    }

    .group-heading {
      font-size: 15px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--accent);
      background: var(--accent-soft);
      border-left: 5px solid var(--accent);
      padding: 8px 12px;
      margin: 14px 0 8px 0;
      border-radius: 0 6px 6px 0;
    }

    .valve-card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .valve-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .valve-badge {
      background: var(--text);
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      padding: 5px 11px;
      border-radius: 5px;
    }

    .block-name {
      font-size: 19px;
      font-weight: 800;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }

    .metric-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
    }

    .metric-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--muted);
    }

    .metric-val {
      font-size: 18px;
      font-weight: 900;
      color: var(--text);
      margin-top: 2px;
    }

    .sub-detail {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      margin-top: 6px;
    }

    .note-box {
      background: var(--warn-bg);
      border: 1.5px solid var(--warn-border);
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 10px;
      text-align: left;
    }

    .shorthand-box {
      margin-top: 22px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .shorthand-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .go-btn {
      min-height: 52px;
      padding: 0 18px;
      font-size: 16px;
      font-weight: 800;
      background: var(--accent);
      color: #ffffff;
      border: 2px solid var(--accent);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .shorthand-result-header {
      background: var(--surface-alt);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .shorthand-token {
      font-size: 16px;
      font-weight: 900;
      color: var(--text);
    }

    .shorthand-interp {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Raupo Irrigation Lookup</h1>
    <p>Hunter Blocks • Valves &amp; Outer Rows</p>
  </header>

  <div class="tabs-wrap">
    <nav class="tabs" aria-label="Lookup mode">
      <button id="tab-hunter" class="tab-btn active" onclick="setMode('hunter')">Hunter Block</button>
      <button id="tab-valve" class="tab-btn" onclick="setMode('valve')">Valve / Station</button>
    </nav>
  </div>

  <main class="container">
    <section id="controls-hunter" class="control-box">
      <label for="select-hunter">Select Hunter Block (1–23)</label>
      <select id="select-hunter" onchange="renderHunter(Number(this.value))"></select>
    </section>

    <section id="controls-valve" class="control-box" style="display:none;">
      <label for="select-valve">Select Valve / Station (1–36, no V34)</label>
      <select id="select-valve" onchange="renderValve(Number(this.value))"></select>
    </section>

    <section id="output"></section>

    <section class="shorthand-box" aria-label="Whiteboard shorthand lookup">
      <label for="shorthand-input">Quick Whiteboard / Shorthand Decoder</label>
      <div class="shorthand-row">
        <input
          id="shorthand-input"
          type="text"
          placeholder="e.g. LOU1, OSI7, WILVI, FIN YV, LAN2"
          onkeydown="if (event.key === 'Enter') runShorthand();"
        />
        <button type="button" class="go-btn" onclick="runShorthand()">Decode</button>
      </div>
      <div id="shorthand-output"></div>
    </section>
  </main>

        label: "Lilly (Hunter Block 4)",
        valves: [21, 22],
        note: "Crossover alert: Valve 21 sits on the William/Lilly boundary track (Rows 1–42); Valve 22 is in the paddock (Rows 1–42N)."
      },
      {
        keys: ["SYL", "SYLVAIN", "SYLCH"],
        label: "Sylvain Chardonnay (Hunter Block 2)",
        valves: [25, 26],
        note: "Covers Sylvain via Valve 25 (Row 46, Rows 17–46) and Valve 26 (Row 47, Rows 47–90)."
      },
      {
        keys: ["SAC", "SACHA"],
        label: "Sacha Pinot Noir (Hunter Blocks 16 & 17)",
        valves: [8, 9, 10, 11],
        note: "Sacha has four valves: V8 (R23), V9 (R58) in HB16, and V10 (R86), V11 (R114) in HB17."
      },
      {
        keys: ["LEOCH", "LEOPOLDCH", "LEOCHN"],
        label: "Leopold Chardonnay (Hunter Block 10)",
        valves: [28, 16],
        note: "Leopold CH covers North (Valve 28, Paddock, N. Rows 83–132) and South (Valve 16, Row 168, S. Rows 83–171)."
      },
      {
        keys: ["LEOPN", "LEOPOLD", "LEOPNS"],
        label: "Leopold Pinot Noir",
        valves: [14, 15, 27],
        note: "Leopold PN North uses Valves 14 & 15 (HB5); Leopold PN South uses Valve 27 (HB9)."
      }
    ];

    const valveMap = Object.fromEntries(DATA.valves.map(v => [v.valve, v]));
    const hunterMap = Object.fromEntries(DATA.hunterBlocks.map(h => [h.id, h]));

    let currentMode = "hunter";
    let currentHunterId = 13;
    let currentValveNum = 29;

    function initControls() {
      const selHunter = document.getElementById("select-hunter");
      DATA.hunterBlocks.forEach(hb => {
        const opt = document.createElement("option");
        opt.value = hb.id;
        opt.textContent = `Block ${hb.id} — ${hb.raw}`;
        selHunter.appendChild(opt);
      });

      const selValve = document.getElementById("select-valve");
      DATA.valves.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.valve;
        opt.textContent = `Valve ${v.valve} — ${v.block} (${v.loc})`;
        selValve.appendChild(opt);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      ["hunter", "valve"].forEach(m => {
        document.getElementById(`tab-${m}`).classList.toggle("active", m === mode);
        document.getElementById(`controls-${m}`).style.display = m === mode ? "block" : "none";
      });

      if (mode === "hunter") renderHunter(currentHunterId);
      if (mode === "valve") renderValve(currentValveNum);
    }

    function valveCardHTML(v, showBlockTitle = true) {
      return `
        <div class="valve-card">
          <div class="valve-top">
            <span class="valve-badge">VALVE ${v.valve}</span>
            ${showBlockTitle ? `<span class="block-name">${v.block.toUpperCase()}</span>` : ""}
          </div>
          <div class="metrics">
            <div class="metric-box">
              <div class="metric-label">Valve Location</div>
              <div class="metric-val">${v.loc}</div>
            </div>
            <div class="metric-box">
              <div class="metric-label">Outer Rows</div>
              <div class="metric-val">${v.rows}</div>
            </div>
          </div>
          <div class="sub-detail">Section / Clone: ${v.sub}</div>
        </div>
      `;
    }

    function renderHunter(id) {
      currentHunterId = id;
      document.getElementById("select-hunter").value = id;

      const hb = hunterMap[id];
      const valves = hb.valves.map(num => valveMap[num]).filter(Boolean);

      const grouped = [];
      const seenBlocks = new Map();
      valves.forEach(v => {
        if (!seenBlocks.has(v.block)) {
          const groupObj = { block: v.block, items: [] };
          seenBlocks.set(v.block, groupObj);
          grouped.push(groupObj);
        }
        seenBlocks.get(v.block).items.push(v);
      });

      let cardsHTML = "";
      grouped.forEach(g => {
        cardsHTML += `<div class="group-heading">${g.block}</div>`;
        cardsHTML += g.items.map(v => valveCardHTML(v, false)).join("");
      });

      document.getElementById("output").innerHTML = `
        <div class="summary-banner">
          <h2 class="summary-title">Hunter Block ${hb.id}: ${hb.clean}</h2>
          <p class="summary-sub">Sheet label: "${hb.raw}" • Valves: ${hb.valves.join(", ")}</p>
          ${hb.note ? `<div class="note-box">Note: ${hb.note}</div>` : ""}
        </div>
        ${cardsHTML}
      `;
    }

    function renderValve(num) {
      currentValveNum = num;
      document.getElementById("select-valve").value = num;
      const v = valveMap[num];
      document.getElementById("output").innerHTML = valveCardHTML(v, true);
    }

    function normalizeCode(raw) {
      return raw
        .toUpperCase()
        .replace(/[-–—/(),.]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function decodeToken(rawToken) {
      const clean = normalizeCode(rawToken);
      const compact = clean.replace(/\s+/g, "");

      // Direct valve match like "V29" or "VALVE 29"
      const valveMatch = clean.match(/^(?:V|VALVE|STATION|STN)\s*(\d{1,2})$/);
      if (valveMatch) {
        const vNum = Number(valveMatch[1]);
        if (valveMap[vNum]) {
          return {
            raw: rawToken,
            title: `Direct Valve ${vNum}`,
            valves: [vNum],
            note: `Direct match to Valve ${vNum} (${valveMap[vNum].block}).`
          };
        }
      }

      // Exact or compact alias rule match
      const exactRule = SHORTHAND_RULES.find(r =>
        r.keys.includes(compact) || r.keys.includes(clean)
      );
      if (exactRule) {
        return {
          raw: rawToken,
          title: exactRule.label,
          valves: exactRule.valves,
          note: exactRule.note
        };
      }

      // Prefix / pattern match for block + number (e.g. "LAN 2 3" or "LOU 1 3")
      const prefixMatches = SHORTHAND_RULES.filter(r =>
        r.keys.some(k => k.length >= 3 && (compact.startsWith(k) || k.startsWith(compact)))
      );
      if (prefixMatches.length > 0) {
        const best = prefixMatches[0];
        const mergedValves = [];
        prefixMatches.forEach(m => m.valves.forEach(vn => {
          if (!mergedValves.includes(vn)) mergedValves.push(vn);
        }));
        return {
          raw: rawToken,
          title: prefixMatches.length === 1 ? best.label : `Possible Matches (${prefixMatches.map(m => m.label).join(" / ")})`,
          valves: mergedValves,
          note: prefixMatches.map(m => m.note).filter(Boolean).join(" ")
        };
      }

      return {
        raw: rawToken,
        title: `No exact match for "${rawToken}"`,
        valves: [],
        note: "Try codes like LOU1, LOU3, OSI7, WILVI, FIN YV, LAN1, LAN2, or V29."
      };
    }

    function runShorthand() {
      const inputEl = document.getElementById("shorthand-input");
      const outEl = document.getElementById("shorthand-output");
      const text = inputEl.value.trim();
      if (!text) {
        outEl.innerHTML = "";
        return;
      }

      const tokens = text
        .split(/[\n,;]+/)
        .map(s => s.trim())
        .filter(Boolean);

      outEl.innerHTML = tokens.map(tok => {
        const res = decodeToken(tok);
        const cards = res.valves
          .map(vn => valveMap[vn])
          .filter(Boolean)
          .map(v => valveCardHTML(v, true))
          .join("");

        return `
          <div class="shorthand-result-header">
            <div class="shorthand-token">"${res.raw}" → Valves: ${res.valves.length ? res.valves.join(", ") : "None"}</div>
            <div class="shorthand-interp">${res.title}</div>
            ${res.note ? `<div class="note-box">${res.note}</div>` : ""}
          </div>
          ${cards}
        `;
      }).join("");
    }

    initControls();
    renderHunter(13);
  </script>
</body>
</html>
